name: publish

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Fetch and save data
        run: |
          curl -fsSL --retry 3 "${{ vars.API_URL }}?action=public" -o web/data.json
          jq -e '.' web/data.json >/dev/null

      - name: Commit and push data.json if changed
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add web/data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "update data.json" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'web'

      - id: d
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
